<html lang="zh-TW">
<head>
  <meta charset="UTF-8">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>WABI・THINGS・STUDIO</title>

  <!-- ==================== 1. Favicon 網頁頁籤小圖示 ==================== -->
  <link rel="icon" href="favicon.jpg" type="image/jpg">

  <!-- ==================== 2. Open Graph 社群分享卡片 (LINE, FB, Discord) ==================== -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://wabithingsstudio.github.io/LandingPage/">
  <meta property="og:title" content="WABI・THINGS・STUDIO">
  <meta property="og:description" content="Web / Software / App / Music / Video / Game">
  <!-- 預覽縮圖的網址，必須是包含 https:// 的完整絕對路徑 -->
  <meta property="og:image" content="https://wabithingsstudio.github.io/LandingPage/og_image.jpg">

  <!-- ==================== 3. Twitter / X 分享卡片 ==================== -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="https://wabithingsstudio.github.io/LandingPage/">
  <meta name="twitter:title" content="WABI・THINGS・STUDIO">
  <meta name="twitter:description" content="Web / Software / App / Music / Video / Game">
  <meta name="twitter:image" content="https://wabithingsstudio.github.io/LandingPage/og_image.jpg">

  <!-- 下面保留你原本引入的 Google Fonts 與 CSS <style>... -->
  
  <!-- 引入明朝體與無襯線體 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* 背景套用和紙圖片 */
    body, html {
      min-height: 100vh;
      background-color: #f4f1ea;
      background-image: url('japanese_paper.jpg');
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: #222120;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .viewport-container {
      /*min-height: 100vh;*/
      height: 100dvh; /* ✨ 關鍵：dvh 會自動扣除網址列與書籤列的干擾 */
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 50px 40px 40px;
      text-align: center;
    }

    /* 明朝體（日文與漢字） */
    .jp-font {
      font-family: 'Noto Serif JP', 'Shippori Mincho', 'Yu Mincho', serif;
      font-weight: 300;
    }

    /* 主視覺圓相 Logo */
    .brand-enso {
      width: 100px;            /* 電腦版顯示寬度（可依喜好微調，如 80px ~ 120px） */
      height: auto;
      margin-bottom: 20px;     /* 與下方英文標題拉開距離 */
      mix-blend-mode: multiply;/* ✨ 核心技術：消除圖片白底，完美融入和紙背景 */
      opacity: 0.9;            /* 降低一點點不透明度，增加墨水滲入紙張的質感 */
      pointer-events: none;    /* 防止滑鼠誤觸反白或拖曳 */
    }

    /* 1. 主標題區 (電腦版) */
    .header-section {
      margin-top: 10px;
      /*margin-bottom: 170px;*/
      margin-bottom: 18vh;
    }

    .title-en {
      font-size: 2.0rem;
      letter-spacing: 0.20em;
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 10px;
      padding-left: 0.20em;
      color: #11100f;
    }

    .title-jp {
      font-size: 1.2rem;
      letter-spacing: 0.25em;
      color: #686560;
      padding-left: 0.25em;
    }

    /* 2. 品牌哲學內文區 (電腦版) */
    .philosophy-section {
      /*margin-bottom: 200px;*/
      margin-bottom: 20vh;
      width: 100%;
      max-width: 520px;
      text-align: left;
      line-height: 1.8;
      font-size: 0.95rem;
      font-weight: 300;
      letter-spacing: 0.04em;
      color: #2a2927;
    }

    .philosophy-item {
      margin-bottom: 22px;
    }

    .philosophy-title {
      font-weight: 400;
      color: #1a1918;
    }

    .philosophy-desc {
      padding-left: 1.8em;
      color: #4a4742;
    }

    /* 3. 業務範疇區 */
    .disciplines-section {
      margin-bottom: auto;
      font-size: 0.82rem;
      letter-spacing: 0.16em;
      color: #78746d;
      font-weight: 300;
      line-height: 1.9;
      transition: color 0.4s ease;
    }

    .disciplines-section:hover {
      color: #1a1918;
    }

    /* 4. 頁尾區 */
    .footer-section {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: baseline;   /* 文字底線對齊 */
      line-height: 1.2;        /* 統一行高 */
      gap: 40px;
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      font-weight: 300;
      color: #78746d;
      padding-top: 30px;
    }
    
    /* 頁尾項目（Email 與 Copyright） */
    .footer-email,
    .footer-copyright {
      transition: color 0.4s ease; /* 0.4 秒平滑漸變 */
    }
    
    /* 微調 Copyright 視覺高度（平時就下移 1px 達到視覺平衡） */
    .footer-copyright {
      transform: translateY(1px);
    }
    
    /* 滑鼠移過去時變黑 */
    .footer-email:hover,
    .footer-copyright:hover {
      color: #1a1918;
    }

    /* =========================================
       螢幕高度受限的電腦版（高度小於 800px 且寬度大於 768px）
       極致微縮版（再縮小 25%，打造極大留白空間）
       ========================================= */
    @media (max-height: 800px) and (min-width: 769px) {
      body, html {
        /*overflow: hidden;*/ 
      }
      
      .viewport-container {
        height: 100dvh; 
        min-height: auto;
        /* 上下 padding 再次壓縮 */
        padding: 15px 30px 8px; 
      }

      .brand-enso {
        width: 60px;        /* 筆電/低高度螢幕的極小圖案 */
        margin-bottom: 8px;
      }
      
      .header-section {
        margin-bottom: 22vh;
      }

      .philosophy-section {
        margin-bottom: 26vh;
      }

      .disciplines-section {
        margin-bottom: auto;
      }

      /* 1. 極小的主視覺圖案 */
      .brand-enso {
        width: 60px; /* 原 80px -> 60px */
        margin-bottom: 8px;
      }
      
      /* 2. 極小的主標題 */
      .title-en {
        font-size: 1.3rem; 
        margin-bottom: 4px;
      }
      .title-jp {
        font-size: 0.85rem; 
      }

      /* 3. 內文與行距極致微縮 */
      .philosophy-section {
        font-size: 0.8rem; 
        max-width: 420px;
      }
      .philosophy-item {
        margin-bottom: 12px; 
      }

      /* 4. 業務範疇區微縮 */
      .disciplines-section {
        font-size: 0.68rem; 
      }

      /* 5. 頁尾與緊湊的排版 */
      .footer-section {
        font-size: 0.65rem; 
        gap: 24px;         
        padding-top: 8px; 
      }
    }
    
    /* =========================================
       螢幕高度受限的電腦版（高度小於 720px 且寬度大於 768px）
       極致微縮版（再縮小 25%，打造極大留白空間）
       ========================================= */
    @media (max-height: 720px) and (min-width: 769px) {
      body, html {
        /*overflow: hidden;*/ 
      }
      
      .viewport-container {
        height: 100dvh; 
        min-height: auto;
        /* 上下 padding 再次壓縮 */
        padding: 15px 30px 8px; 
      }

      .brand-enso {
        width: 60px;        /* 筆電/低高度螢幕的極小圖案 */
        margin-bottom: 8px;
      }
      
      .header-section {
        margin-bottom: 20vh;
      }

      .philosophy-section {
        margin-bottom: 24vh;
      }

      .disciplines-section {
        margin-bottom: auto;
      }

      /* 1. 極小的主視覺圖案 */
      .brand-enso {
        width: 60px; /* 原 80px -> 60px */
        margin-bottom: 8px;
      }
      
      /* 2. 極小的主標題 */
      .title-en {
        font-size: 1.15rem; /* 原 1.3rem -> 1.0rem */
        margin-bottom: 4px;
      }
      .title-jp {
        font-size: 0.65rem; /* 原 0.85rem -> 0.65rem */
      }

      /* 3. 內文與行距極致微縮 */
      .philosophy-section {
        font-size: 0.7rem; /* 原 0.78rem -> 0.6rem (約 9.6px) */
        max-width: 320px;
      }
      .philosophy-item {
        margin-bottom: 8px; /* 原 12px -> 8px */
      }

      /* 4. 業務範疇區微縮 */
      .disciplines-section {
        font-size: 0.55rem; /* 原 0.68rem -> 0.55rem (約 8.8px) */
      }

      /* 5. 頁尾與緊湊的排版 */
      .footer-section {
        font-size: 0.5rem; /* 原 0.65rem -> 0.5rem (約 8px) */
        gap: 18px;         /* 原 24px -> 18px */
        padding-top: 8px; 
      }
    }

    
    /* RWD 手機版專屬優化 */
    @media (max-width: 768px) {
      .viewport-container {
        padding: 40px 16px 30px;
      }
      
      .brand-enso {
        width: 70px;         /* 手機版適度縮小 */
        margin-bottom: 12px; /* 縮小與標題的距離 */
      }
      
      .header-section {
        /*margin-bottom: 130px;*/ /* 手機版的間距（可依需求調整） */
        margin-bottom: 16vh;
      }
      
      .title-en {
        font-size: 1.25rem;
        letter-spacing: 0.12em;
        padding-left: 0.12em;
        white-space: nowrap;
      }

      .title-jp {
        font-size: 0.75rem;
        letter-spacing: 0.18em;
      }

      .philosophy-section {
        font-size: 0.85rem;
        max-width: 100%;
        padding: 0;
        /*margin-bottom: 120px;*/
        margin-bottom: 16vh;
      }

      .philosophy-item {
        margin-bottom: 18px;
      }

      .philosophy-desc {
        padding-left: 1.8em;
        font-size: 0.75rem;
        letter-spacing: -0.01em;
      }

      .disciplines-section {
        font-size: 0.75rem;
        line-height: 1.8;
      }

      .footer-section {
        flex-direction: column;
        align-items: center; /* 👈 手機版直立時改回置中 */
        gap: 12px;
        text-align: center;
        font-size: 0.72rem;
      }
    }
  </style>
</head>

    <header class="header-section">

    <footer class="footer-section">
      <div class="footer-email">

      <div class="footer-copyright">

      </div>
    </footer>

  </div>

</body>
