<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WABI・THINGS・STUDIO</title>
  
  <!-- 引入明朝體與無襯線體 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* 背景套用和紙圖片 */
    body, html {
      min-height: 100vh;
      background-color: #f4f1ea;
      background-image: url('japanese_paper.jpg');
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: #222120;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .viewport-container {
      min-height: 100vh;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 50px 40px 40px;
      text-align: center;
    }

    /* 明朝體（日文與漢字） */
    .jp-font {
      font-family: 'Noto Serif JP', 'Shippori Mincho', 'Yu Mincho', serif;
      font-weight: 300;
    }

    /* 1. 主標題區 (電腦版) */
    .header-section {
      margin-top: 10px;
      margin-bottom: 180px;
    }

    .title-en {
      font-size: 2.0rem;
      letter-spacing: 0.20em;
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 10px;
      padding-left: 0.20em;
      color: #11100f;
    }

    .title-jp {
      font-size: 1.2rem;
      letter-spacing: 0.25em;
      color: #686560;
      padding-left: 0.25em;
    }

    /* 2. 品牌哲學內文區 (電腦版) */
    .philosophy-section {
      margin-bottom: 180px;
      width: 100%;
      max-width: 520px;
      text-align: left;
      line-height: 1.8;
      font-size: 0.95rem;
      font-weight: 300;
      letter-spacing: 0.04em;
      color: #2a2927;
    }

    .philosophy-item {
      margin-bottom: 22px;
    }

    .philosophy-title {
      font-weight: 400;
      color: #1a1918;
    }

    .philosophy-desc {
      padding-left: 1.8em;
      color: #4a4742;
    }

    /* 3. 業務範疇區 */
    .disciplines-section {
      margin-bottom: auto;
      font-size: 0.82rem;
      letter-spacing: 0.16em;
      color: #78746d;
      font-weight: 300;
      line-height: 1.9;
      transition: color 0.4s ease;
    }

    .disciplines-section:hover {
      color: #1a1918;
    }

    /* 4. 頁尾區 */
    .footer-section {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: baseline;   /* 👈 1. 從 center 改為 baseline（文字底線對齊） */
      line-height: 1.2;        /* 👈 2. 加入統一行高，消除字型預設的高度偏差 */
      gap: 80px;
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      font-weight: 300;
      color: #78746d;
      padding-top: 30px;
    }

    .footer-section a {
      color: inherit;
      text-decoration: none;
      border-bottom: 1px dotted rgba(120, 116, 109, 0.4);
      padding-bottom: 2px;
      transition: all 0.3s ease;
    }

    .footer-section a:hover {
      color: #1a1918;
      border-bottom-color: #1a1918;
    }

    /* RWD 手機版專屬優化 */
    @media (max-width: 768px) {
      .viewport-container {
        padding: 40px 16px 30px;
      }

      .header-section {
        margin-bottom: 130px; /* 手機版的間距（可依需求調整） */
      }
      
      .title-en {
        font-size: 1.5rem;
        letter-spacing: 0.12em;
        padding-left: 0.12em;
        white-space: nowrap;
      }

      .title-jp {
        font-size: 0.75rem;
        letter-spacing: 0.18em;
      }

      .philosophy-section {
        font-size: 0.85rem;
        max-width: 100%;
        padding: 0;
        margin-bottom: 120px;
      }

      .philosophy-item {
        margin-bottom: 18px;
      }

      .philosophy-desc {
        padding-left: 1.8em;
        font-size: 0.75rem;
        letter-spacing: -0.01em;
      }

      .disciplines-section {
        font-size: 0.75rem;
        line-height: 1.8;
      }

      .footer-section {
        flex-direction: column;
        gap: 12px;
        text-align: center;
        font-size: 0.72rem;
      }
    }
  </style>
</head>
<body>

  <div class="viewport-container">
    
    <!-- 1. 主標題區 -->
    <header class="header-section">
      <h1 class="title-en">WABI・THINGS・STUDIO</h1>
      <div class="title-jp jp-font">ワビ・シングス・スタジオ</div>
    </header>

    <!-- 2. 品牌哲學內文區 -->
    <main class="philosophy-section">
      <div class="philosophy-item">
        <div class="philosophy-title">Wabi（<span class="jp-font">侘び</span>）</div>
        <div class="philosophy-desc">— simplicity, quiet refinement, and understated beauty.</div>
      </div>
      <div class="philosophy-item">
        <div class="philosophy-title">Things（<span class="jp-font">物・事</span>）</div>
        <div class="philosophy-desc">— thoughts given form.</div>
      </div>
      <div class="philosophy-item">
        <div class="philosophy-title">Studio（<span class="jp-font">作り処</span>）</div>
        <div class="philosophy-desc">— where ideas come to life.</div>
      </div>
    </main>

    <!-- 3. 業務範疇區 -->
    <div class="disciplines-section">
      <div>— Web / Software / App —</div>
      <div>— Music / Video / Game —</div>
    </div>

    <!-- 4. 頁尾區 -->
    <footer class="footer-section">
      <div class="footer-email">
        wabi.things.studio@gmail.com
      </div>
      <div class="footer-copyright">
        © 2026 WABI・THINGS・STUDIO・TAIWAN
      </div>
    </footer>

  </div>

</body>
</html>
