<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WABI・THINGS・STUDIO</title>
  
  <!-- 引入明朝體與無襯線體 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400&family=Plus+Jakarta+Sans:wght@300;400&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* 背景套用和紙圖片 */
    body, html {
      min-height: 100vh;
      background-color: #f4f1ea; /* 圖片載入前的備用和紙底色 */
      background-image: url('japanese_paper.jpg'); /* 套用你的和紙圖 */
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: #222120; /* 濃墨色文字 */
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .viewport-container {
      min-height: 100vh;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 90px 40px 50px;
      text-align: center;
    }

    /* 明朝體（日文與漢字） */
    .jp-font {
      font-family: 'Noto Serif JP', 'Shippori Mincho', 'Yu Mincho', serif;
      font-weight: 300;
    }

    /* 1. 主標題區 */
    .header-section {
      margin-top: auto;
      margin-bottom: 60px;
    }

    .title-en {
      font-size: 1.65rem;
      letter-spacing: 0.38em;
      font-weight: 300;
      text-transform: uppercase;
      margin-bottom: 12px;
      padding-left: 0.38em;
      color: #1a1918;
    }

    .title-jp {
      font-size: 0.85rem;
      letter-spacing: 0.28em;
      color: #686560; /* 柔和松煙灰 */
      padding-left: 0.28em;
    }

    /* 2. 品牌哲學內文區 */
    .philosophy-section {
      margin-bottom: 60px;
      max-width: 720px;
      line-height: 2.2;
      font-size: 0.95rem;
      font-weight: 300;
      letter-spacing: 0.04em;
      color: #2a2927;
    }

    .philosophy-line {
      margin: 10px 0;
    }

    /* 3. 業務範疇區 */
    .disciplines-section {
      margin-bottom: auto;
      font-size: 0.82rem;
      letter-spacing: 0.16em;
      color: #78746d;
      font-weight: 300;
      transition: color 0.4s ease;
    }

    .disciplines-section:hover {
      color: #1a1918;
    }

    .dash {
      margin: 0 12px;
      opacity: 0.5;
    }

    /* 4. 頁尾區 */
    .footer-section {
      width: 100%;
      max-width: 1000px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      font-weight: 300;
      color: #78746d;
      padding-top: 40px;
    }

    .footer-section a {
      color: inherit;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .footer-section a:hover {
      color: #1a1918;
    }

    /* RWD 適配 */
    @media (max-width: 768px) {
      .viewport-container {
        padding: 60px 24px 40px;
      }

      .title-en {
        font-size: 1.25rem;
        letter-spacing: 0.25em;
      }

      .philosophy-section {
        font-size: 0.88rem;
        line-height: 2.0;
      }

      .footer-section {
        flex-direction: column;
        gap: 12px;
        text-align: center;
      }
    }
  </style>
</head>
<body>

  <div class="viewport-container">
    
    <!-- 標題區 -->
    <header class="header-section">
      <h1 class="title-en">WABI・THINGS・STUDIO</h1>
      <div class="title-jp jp-font">ワビ・シングス・スタジオ</div>
    </header>

    <!-- 品牌哲學內文 -->
    <main class="philosophy-section">
      <p class="philosophy-line">Wabi（<span class="jp-font">侘び</span>）— simplicity, quiet refinement, and understated beauty.</p>
      <p class="philosophy-line">Things（<span class="jp-font">物・事</span>）— thoughts given form.</p>
      <p class="philosophy-line">Studio（<span class="jp-font">作り処</span>）— where ideas come to life.</p>
    </main>

    <!-- 業務範疇 -->
    <div class="disciplines-section">
      <span class="dash">—</span> Web / Software / App / Music / Video / Game <span class="dash">—</span>
    </div>

    <!-- 頁尾 -->
    <footer class="footer-section">
      <div class="footer-email">
        <a href="mailto:hello@wabithingsstudio.com">hello@wabithingsstudio.com</a>
      </div>
      <div class="footer-copyright">
        © 2026 WABI・THINGS・STUDIO・TAIWAN
      </div>
    </footer>

  </div>

</body>
</html>
